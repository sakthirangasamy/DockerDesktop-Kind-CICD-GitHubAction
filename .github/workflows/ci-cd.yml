
name: Spring Boot Kind Kubernetes CI-CD

on:
  push:
    branches:
      - sakthi_dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Build and Test
        run: mvn clean verify

      - name: Build Docker Image
        run: docker build -t springboot-eks:${{ github.sha }} .

      - name: Load Image into Kind
        run: kind load docker-image springboot-eks:${{ github.sha }} --name springboot-cluster

      - name: Apply Kubernetes Deployment
        run: kubectl apply -f k8s/deployment.yaml

      - name: Apply Kubernetes Service
        run: kubectl apply -f k8s/service.yaml

      - name: Update Deployment Image
        run: kubectl set image deployment/springboot-deployment springboot-container=springboot-eks:${{ github.sha }}

      - name: Verify Deployment
        run: kubectl rollout status deployment/springboot-deployment --timeout=180s

      - name: Check Kubernetes Resources
        run: kubectl get pods,svc,nodes
