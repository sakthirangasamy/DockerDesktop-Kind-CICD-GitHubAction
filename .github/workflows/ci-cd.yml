
name: Spring Boot Kubernetes CI-CD

on:
  push:
    branches:
      - sakthi_dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Build and Test
        run: mvn clean verify

      - name: Build Docker Image
        run: docker build -t springboot-eks:${{ github.sha }} .

      - name: Load Image into Kind
        run: kind load docker-image springboot-eks:${{ github.sha }} --name springboot-cluster

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/springboot-deployment springboot-container=springboot-eks:${{ github.sha }}
          kubectl rollout status deployment/springboot-deployment --timeout=180s
